services:
  app:
    container_name: tiempoweb-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_OWM_API_KEY: ${VITE_OWM_API_KEY}
        VITE_AEMET_API_KEY: ${VITE_AEMET_API_KEY}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  dev:
    container_name: tiempoweb-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../web/src:/app/web/src
      - ../shared:/app/shared
    environment:
      - CHOKIDAR_USEPOLLING=true
