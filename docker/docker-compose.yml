services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../web/src:/app/web/src
      - ../shared:/app/shared
    environment:
      - CHOKIDAR_USEPOLLING=true
